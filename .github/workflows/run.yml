name: Dovel test run
# One run of the Dovel flow per repository of a set, each on its own GitHub-hosted Ubuntu runner (24.04, or 26.04
# for a set entry with "runner": "2604": the image the repository's own CI uses), then the product's own acceptance scorer over all of them.
# The product is a snapshot from the private snapshot repository, or an encrypted file (products/<sha>.tar.gz.enc,
# key in the PRODUCT_KEY secret).
#
# The job that runs repository code (`run`: installs, tests, the repository's CI, as root via sudo) holds no
# GitHub token: root can read any process's memory on its runner, Runner.Worker's included, which holds every
# secret its job references. So the work that needs MIRRORS_TOKEN is done by jobs that run no repository code:
# `prepare-product` and `prepare` fetch the product and each mirror and hand them over as artifacts, and `publish`
# opens the pull requests `run` only wrote down (--publication-out), checking each again
# (scripts/publish-dovel-proposals.mjs). `run` holds OPENROUTER_API_KEY and ANTHROPIC_API_KEY, for its model calls
# (the product sends them to Anthropic when ANTHROPIC_API_KEY is set; the publisher's review too), and HANDOFF_KEY:
# this repository's artifacts are public, so the product hand-off is uploaded only encrypted with HANDOFF_KEY (a key
# for the hand-off alone, not PRODUCT_KEY, which only prepare-product's encrypted-snapshot fallback reads), and every
# job decrypts it in its first unpacking step, before any repository code runs (the key in that step's environment
# only, its key file removed in the same step). The key still reaches the runner of a `run` leg.
on:
  workflow_dispatch:
    inputs:
      set:
        description: Set file under sets/ (without .json)
        required: true
      product:
        description: Product snapshot under products/ (short sha)
        required: true
      open_pr:
        description: Open pull requests on the mirrors ('true') or only report ('false')
        default: 'false'
      ci_gate:
        description: Let each mirror's own CI judge the pull requests ('true')
        default: 'false'
      only:
        description: Comma-separated set indexes to run (empty runs all)
        default: ''
      ci_runner:
        description: How updates are judged - 'act' (the repository's own CI jobs, run with act) or 'emulate'
        default: 'emulate'
      max_candidates:
        description: Updates to attempt per repository (batches use 3)
        default: '3'
      catch_up:
        description: First-run catch-up mode - 'auto' (batches), 'true' or 'false'
        default: 'auto'
      second_chance:
        description: Second-chance code fix of earlier runs' open pull requests whose own CI failed in jobs Dovel could not run ('true'; needs open_pr, ci_gate and ci_runner act)
        default: 'false'
permissions:
  contents: read
concurrency:
  group: dovel-test-${{ inputs.set }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          SET: ${{ inputs.set }}
          ONLY: ${{ inputs.only }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          entries = json.load(open(f"sets/{os.environ['SET']}.json"))
          only = {int(x) for x in os.environ.get('ONLY', '').split(',') if x.strip()}
          entries = [e for e in entries if not only or e['index'] in only]
          # Longest legs first (a set entry's optional est_minutes, measured on an earlier run of the same
          # repository by tools/set-order-hints.py): only the order the matrix starts its legs in changes.
          entries.sort(key=lambda e: -float(e.get('est_minutes') or 0))
          print('matrix=' + json.dumps(entries))
          EOF

  # The product snapshot, once for every job: no repository code runs here. Its digest is this job's output,
  # which no later job can change; every job that uses the artifact checks it (a `run` job can replace an
  # artifact of this run with the runtime token its runner holds).
  prepare-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: testbed
      - name: Unpack the product snapshot
        env:
          PRODUCT_KEY: ${{ secrets.PRODUCT_KEY }}
          PRODUCT: ${{ inputs.product }}
          MIRRORS_TOKEN: ${{ secrets.MIRRORS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/product"
          # A snapshot from the private snapshot repository (branch snap-<sha>); the encrypted file is the fallback.
          if git clone -q --depth 1 --branch "snap-$PRODUCT" "https://x-access-token:${MIRRORS_TOKEN}@github.com/dovel-pr17-validation/dovel-product-snapshots.git" "$RUNNER_TEMP/product-clone" 2>/dev/null; then
            rm -rf "$RUNNER_TEMP/product-clone/.git"; cp -r "$RUNNER_TEMP/product-clone/." "$RUNNER_TEMP/product/"; rm -rf "$RUNNER_TEMP/product-clone"
          else
            printf '%s' "$PRODUCT_KEY" > "$RUNNER_TEMP/product.key"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass "file:$RUNNER_TEMP/product.key" \
              -in "testbed/products/$PRODUCT.tar.gz.enc" | tar -xz -C "$RUNNER_TEMP/product"
            rm -f "$RUNNER_TEMP/product.key"
          fi
      - id: pack
        env:
          HANDOFF_KEY: ${{ secrets.HANDOFF_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/handoff"
          # This repository is public, and so are its artifacts: only the ciphertext of the product is uploaded (HANDOFF_KEY).
          [ -n "${HANDOFF_KEY:-}" ] || { echo "::error::the HANDOFF_KEY secret is not set: the product hand-off is only uploaded encrypted"; exit 1; }
          trap 'rm -f "$RUNNER_TEMP/handoff.key"' EXIT
          ( umask 077; printf '%s' "$HANDOFF_KEY" > "$RUNNER_TEMP/handoff.key" )
          unset HANDOFF_KEY
          tar -C "$RUNNER_TEMP/product" -cz . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass "file:$RUNNER_TEMP/handoff.key" -out "$RUNNER_TEMP/handoff/product.tar.gz.enc"
          rm -f "$RUNNER_TEMP/handoff.key"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/handoff/product.tar.gz.enc" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: product
          path: ${{ runner.temp }}/handoff/product.tar.gz.enc
          retention-days: 1

  # Each mirror, cloned with MIRRORS_TOKEN by a job that runs none of its code, and handed to `run` as an
  # artifact (a tar, so the checkout's modes, symbolic links and .git survive the upload).
  prepare:
    needs: plan
    name: prepare ${{ matrix.index }} ${{ matrix.source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Clone the mirror
        env:
          MIRROR: ${{ matrix.mirror }}
          BRANCH: ${{ matrix.branch }}
          MIRRORS_TOKEN: ${{ secrets.MIRRORS_TOKEN }}
        run: |
          set -euo pipefail
          # The token is used for the clone only; the checkout keeps a tokenless origin.
          for attempt in 1 2 3; do
            GIT_LFS_SKIP_SMUDGE=1 git clone -q --branch "$BRANCH" "https://x-access-token:${MIRRORS_TOKEN}@github.com/${MIRROR}.git" "$RUNNER_TEMP/repo" && break
            rm -rf "$RUNNER_TEMP/repo"; [ "$attempt" -lt 3 ] || exit 91; sleep 20
          done
          git -C "$RUNNER_TEMP/repo" remote set-url origin "https://github.com/${MIRROR}.git"
          # Submodules as the repository's own CI checkout fetches them (actions/checkout submodules: recursive);
          # their URLs are the upstream ones, fetched without the token.
          if [ -f "$RUNNER_TEMP/repo/.gitmodules" ]; then
            git -C "$RUNNER_TEMP/repo" -c credential.helper= -c gc.auto=0 -c maintenance.auto=false -c fetch.writeCommitGraph=false submodule update --init --recursive --depth 1 || echo "::warning::some submodules could not be fetched"
          fi
          git -C "$RUNNER_TEMP/repo" config user.name "Dovel Labs"
          git -C "$RUNNER_TEMP/repo" config user.email "dovel@users.noreply.github.com"
          # Nothing handed to the job that runs repository code may carry the token.
          if grep -rqF -- "$MIRRORS_TOKEN" "$RUNNER_TEMP/repo/.git"; then echo "::error::the mirror's Git metadata still holds the token"; exit 92; fi
          mkdir -p "$RUNNER_TEMP/handoff"
          # A detached Git housekeeping process can still be writing a pack; archive once the tree is still.
          for attempt in 1 2 3; do
            tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/handoff/repo.tar" repo && break
            [ "$attempt" -lt 3 ] || exit 93; sleep 15
          done
      - uses: actions/upload-artifact@v4
        with:
          name: input-${{ matrix.index }}
          path: ${{ runner.temp }}/handoff/repo.tar
          retention-days: 1

  # The second-chance code fix's token side (scripts/lib/second-chance/scan.mjs, product's dovel-ci-repair.mjs scan
  # --second-chance-only): holds MIRRORS_TOKEN and runs no repository code. It applies the CI verdicts of the mirror's
  # open Dovel pull requests first (re-runs, readiness, closes: what a publish job's sweep does), then claims each one
  # whose own CI failed the update, proven against the base branch's CI, only in jobs the earlier run left to that CI,
  # and hands its request (the failing jobs' redacted log excerpts) to `run` as data. Its claims go to `publish` from
  # this job's own artifact, never from `run`'s.
  second-chance-scan:
    needs: [plan, prepare-product]
    if: inputs.second_chance == 'true' && inputs.open_pr == 'true' && inputs.ci_gate == 'true' && needs.plan.result == 'success' && needs.prepare-product.result == 'success'
    name: second-chance scan ${{ matrix.index }} ${{ matrix.source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: product
          path: ${{ runner.temp }}/handoff
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unpack and install the product
        env:
          PRODUCT_SHA256: ${{ needs.prepare-product.outputs.sha256 }}
          HANDOFF_KEY: ${{ secrets.HANDOFF_KEY }}
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          echo "$PRODUCT_SHA256  $RUNNER_TEMP/handoff/product.tar.gz.enc" | sha256sum -c --quiet
          trap 'rm -f "$RUNNER_TEMP/handoff.key"' EXIT
          ( umask 077; printf '%s' "$HANDOFF_KEY" > "$RUNNER_TEMP/handoff.key" )
          unset HANDOFF_KEY
          mkdir -p "$RUNNER_TEMP/product" && { openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass "file:$RUNNER_TEMP/handoff.key" -in "$RUNNER_TEMP/handoff/product.tar.gz.enc" | tar -xz -C "$RUNNER_TEMP/product"; }
          rm -f "$RUNNER_TEMP/handoff.key"
          cd "$RUNNER_TEMP/product"
          for attempt in 1 2 3; do corepack pnpm install --frozen-lockfile && break; [ "$attempt" -lt 3 ] || exit 1; sleep $((attempt * 15)); done
          corepack pnpm build
      - name: Sweep the CI verdicts, then scan and claim
        env:
          GH_TOKEN: ${{ secrets.MIRRORS_TOKEN }}
          MIRROR: ${{ matrix.mirror }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/second-chance"; mkdir -p "$out/requests"
          cd "$RUNNER_TEMP/product"
          node --import ./packages/part-a/node_modules/tsx/dist/loader.mjs scripts/dovel-ci-verdict.mjs --repo "$MIRROR" 2>&1 | tee "$out/verdicts.log" || true
          node --import ./packages/part-a/node_modules/tsx/dist/loader.mjs scripts/dovel-ci-repair.mjs scan --claim --second-chance true --second-chance-only true \
            --repo "$MIRROR" --out "$out/requests" --claims-out "$out/claims.txt" 2>&1 | tee "$out/scan.log" || echo "::warning::the second-chance scan failed"
          if grep -rqF -- "$GH_TOKEN" "$out"; then echo "::error::the hand-off holds the token"; exit 92; fi
      - uses: actions/upload-artifact@v4
        with:
          name: second-chance-${{ matrix.index }}
          path: ${{ runner.temp }}/second-chance
          retention-days: 30

  run:
    needs: [plan, prepare-product, prepare, second-chance-scan]
    if: always() && needs.plan.result == 'success' && needs.prepare-product.result == 'success'
    name: ${{ matrix.index }} ${{ matrix.source }}
    # The repository's own CI image: a set entry's "runner": "2604" runs on 26.04, any other on 24.04.
    runs-on: ${{ matrix.runner == '2604' && 'ubuntu-26.04' || 'ubuntu-24.04' }}
    timeout-minutes: 330
    # No MIRRORS_TOKEN, nothing it could publish with: this job runs the repository's code. HANDOFF_KEY only decrypts
    # the product hand-off, in the unpacking step that runs before any repository code.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The org's whole concurrent-job allowance (20 on the Free plan): a 16 cap kept the 17th-25th legs queued
      # behind running ones (r40: up to 17 min). Each leg's own time budget counts from its own start.
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      # The job's own start: the flow admits no phase past timeout-minutes (less 15 for keeping the results).
      - run: echo "JOB_STARTED_AT=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: product
          path: ${{ runner.temp }}/handoff
      - uses: actions/download-artifact@v4
        with:
          name: input-${{ matrix.index }}
          path: ${{ runner.temp }}/handoff
      # The second-chance requests the token job wrote for this mirror, as data (none without second_chance).
      # Only when the token job itself finished: otherwise an artifact of that name could be another job's.
      - uses: actions/download-artifact@v4
        if: inputs.second_chance == 'true' && needs.second-chance-scan.result == 'success'
        continue-on-error: true
        with:
          name: second-chance-${{ matrix.index }}
          path: ${{ runner.temp }}/second-chance
      - name: Unpack the product and the mirror
        env:
          PRODUCT_SHA256: ${{ needs.prepare-product.outputs.sha256 }}
          HANDOFF_KEY: ${{ secrets.HANDOFF_KEY }}
        run: |
          set -euo pipefail
          echo "$PRODUCT_SHA256  $RUNNER_TEMP/handoff/product.tar.gz.enc" | sha256sum -c --quiet
          trap 'rm -f "$RUNNER_TEMP/handoff.key"' EXIT
          ( umask 077; printf '%s' "$HANDOFF_KEY" > "$RUNNER_TEMP/handoff.key" )
          unset HANDOFF_KEY
          mkdir -p "$RUNNER_TEMP/product"
          { openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass "file:$RUNNER_TEMP/handoff.key" -in "$RUNNER_TEMP/handoff/product.tar.gz.enc" | tar -xz -C "$RUNNER_TEMP/product"; }
          rm -f "$RUNNER_TEMP/handoff.key"
          tar -xf "$RUNNER_TEMP/handoff/repo.tar" -C "$RUNNER_TEMP"
          rm -rf "$RUNNER_TEMP/handoff"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the product
        working-directory: ${{ runner.temp }}/product
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do corepack pnpm install --frozen-lockfile && break; [ "$attempt" -lt 3 ] || exit 1; sleep $((attempt * 15)); done
          corepack pnpm build
      # As dovel-flow/action.yml "Sandbox the validation of model-edited code": before any repository code runs. The
      # migration agent works only in it; a product without it (or a runner where it cannot be set up) attempts no migration.
      - name: Sandbox the validation of model-edited code
        id: validation-sandbox
        working-directory: ${{ runner.temp }}/product
        run: |
          set -uo pipefail
          [ -f scripts/validation-sandbox.mjs ] || { echo "::notice::this product has no validation sandbox"; exit 0; }
          sudo -n "$(command -v node)" scripts/validation-sandbox.mjs configure --node "$(command -v node)" || { echo "::warning::validation sandbox setup failed: no migration is attempted in this job"; exit 0; }
          /usr/lib/dovel-validate-sandbox/bin/dovel-validate verify >/dev/null || { echo "::warning::validation sandbox check failed: no migration is attempted in this job"; exit 0; }
          echo "entry=/usr/lib/dovel-validate-sandbox/bin/dovel-validate" >> "$GITHUB_OUTPUT"
      - name: Run the Dovel flow
        env:
          DOVEL_INPUT_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY }}
          DOVEL_INPUT_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          PIN_UPDATE: ${{ matrix.only }}
          PIN_RELEASES_BEFORE: ${{ matrix.releases_before }}
          MIRROR: ${{ matrix.mirror }}
          OPEN_PR: ${{ inputs.open_pr }}
          CI_GATE: ${{ inputs.ci_gate }}
          CI_RUNNER: ${{ inputs.ci_runner }}
          MAX_CANDIDATES: ${{ inputs.max_candidates }}
          CATCH_UP: ${{ inputs.catch_up }}
          SOURCE: ${{ matrix.source }}
          SECOND_CHANCE: ${{ inputs.second_chance }}
          DOVEL_VALIDATION_SANDBOX_ENTRY: ${{ steps.validation-sandbox.outputs.entry }}
        run: |
          set -uo pipefail
          output="$RUNNER_TEMP/out"; mkdir -p "$output"
          # As action.yml's flow step: the validation sandbox the step above set up, required by the flow (fail closed).
          sandbox=()
          if [ -n "${DOVEL_VALIDATION_SANDBOX_ENTRY:-}" ]; then export AUTOMATED_API_VALIDATION_SANDBOX="$DOVEL_VALIDATION_SANDBOX_ENTRY"; sandbox=(--validation-sandbox required); echo "validation sandbox: $DOVEL_VALIDATION_SANDBOX_ENTRY"; fi
          unset DOVEL_VALIDATION_SANDBOX_ENTRY
          # The second-chance requests ride on the CI repair round's input (the flow reads <input>/second-chance/).
          second_chance=()
          if [ "$SECOND_CHANCE" = true ] && [ -d "$RUNNER_TEMP/second-chance/requests/second-chance" ]; then
            second_chance=(--ci-repair true --second-chance true --ci-repair-input "$RUNNER_TEMP/second-chance/requests")
          fi
          # A set entry pinned to one update (a repair batch, tools/repair-batch.py: "only" <ecosystem>:<name>@<version>,
          # "releases_before" <ISO time>) runs as the migration benchmark runs a case (run-case.mjs): exactly that update at
          # that release, the scan's releases as of that time, no catch-up. Entries without them run as before.
          pinned=()
          if [ -n "${PIN_UPDATE:-}" ]; then pinned=(--only "$PIN_UPDATE"); CATCH_UP=false; fi
          if [ -n "${PIN_RELEASES_BEFORE:-}" ]; then pinned+=(--releases-before "$PIN_RELEASES_BEFORE"); fi
          unset PIN_UPDATE PIN_RELEASES_BEFORE
          # The runner's memory and disk each minute, in the job log, so a runner lost mid-run leaves its last state.
          ( while sleep 60; do echo "[resources $(date -u +%H:%M:%S)] mem: $(free -m | awk 'NR==2{print $3"/"$2" MiB used, "$7" avail"}') swap: $(free -m | awk 'NR==3{print $3"/"$2}') disk: $(df -m / | awk 'NR==2{print $4" MiB free"}')"; done ) &
          # As dovel-flow/action.yml does: the keys reach the flow over stdin, and every credential-shaped
          # variable is unset before the flow replaces this shell, so repository code never reads one.
          secrets="$(node -e '
            const pairs = [["OPENROUTER_API_KEY", "DOVEL_INPUT_OPENROUTER"], ["ANTHROPIC_API_KEY", "DOVEL_INPUT_ANTHROPIC"]];
            process.stdout.write(JSON.stringify(Object.fromEntries(pairs.filter(([, from]) => process.env[from]).map(([to, from]) => [to, process.env[from]]))));
          ')"
          unset DOVEL_INPUT_OPENROUTER DOVEL_INPUT_ANTHROPIC
          shopt -s nocasematch
          for variable in $(compgen -e); do
            if [[ "$variable" =~ (token|secret|password|credential|api[_-]?key|private[_-]?key) && "$variable" != TIKTOKEN_CACHE_DIR ]]; then unset "$variable"; fi
          done
          shopt -u nocasematch
          export TMPDIR="$RUNNER_TEMP/dovel-tmp"; mkdir -p "$TMPDIR"
          cd "$RUNNER_TEMP/product"
          # Pull requests are written down for the publish job, never opened here; the sweep of earlier ones'
          # CI verdicts needs the token, so the publish job runs it.
          REVIEWER_RUNTIME=openrouter node --import ./packages/part-a/node_modules/tsx/dist/loader.mjs scripts/run-dovel-flow.mjs \
            --repository "$RUNNER_TEMP/repo" --owner "${MIRROR%%/*}" --name "${MIRROR#*/}" --max-candidates "${MAX_CANDIDATES:-3}" --catch-up "${CATCH_UP:-auto}" \
            --open-pr "$OPEN_PR" --ci-gate "$CI_GATE" --publication-out "$RUNNER_TEMP/publications" --skip-ci-verdict-sweep \
            --ci-runner "$CI_RUNNER" --ci-repository "$SOURCE" --act-cache-dir "$RUNNER_TEMP/act-cache" --act-jobs 2 --act-job-timeout-minutes 30 --job-deadline-at "$(( JOB_STARTED_AT + (330 - 15) * 60000 ))" \
            "${second_chance[@]+"${second_chance[@]}"}" "${pinned[@]+"${pinned[@]}"}" "${sandbox[@]+"${sandbox[@]}"}" --output-dir "$output" --secrets-stdin <<<"$secrets" > "$output/flow.log" 2>&1 && code=0 || code=$?
          printf '{"exitCode":%s,"source":"%s","mirror":"%s","runner":"github-hosted ubuntu-%s"}\n' "$code" "${{ matrix.source }}" "$MIRROR" "$(. /etc/os-release && echo "$VERSION_ID")" > "$output/run.json"
          tail -40 "$output/flow.log"
      - name: Keep the results (logs and receipts, not dependency trees)
        if: always()
        run: |
          out="$RUNNER_TEMP/out"; [ -d "$out" ] || exit 0
          chmod -R u+w "$out" 2>/dev/null || true
          find "$out" -type d \( -name node_modules -o -name target -o -name .gradle -o -name .venv -o -name gomodcache -o -name .pnpm-store -o -name workspace \) -prune -exec rm -rf {} + 2>/dev/null || true
          slug=$(printf '%02d' "${{ matrix.index }}")-$(echo "${{ matrix.source }}" | tr '/' '-')
          mkdir -p "$RUNNER_TEMP/results/$slug" && cp -r "$out/." "$RUNNER_TEMP/results/$slug/"
          echo "SLUG=$slug" >> "$GITHUB_ENV"
          # The publish job's input: the requests and the progress doc they complete.
          if [ -d "$RUNNER_TEMP/publications" ]; then
            mkdir -p "$RUNNER_TEMP/publication/$slug"
            cp -r "$RUNNER_TEMP/publications" "$RUNNER_TEMP/publication/$slug/requests"
            if [ -f "$out/repository-progress.json" ]; then cp "$out/repository-progress.json" "$RUNNER_TEMP/publication/$slug/"; fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ env.SLUG }}
          path: ${{ runner.temp }}/results
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always() && inputs.open_pr == 'true'
        with:
          name: publication-${{ matrix.index }}
          path: ${{ runner.temp }}/publication
          if-no-files-found: ignore
          retention-days: 30

  # Opens the pull requests each `run` leg wrote down. It holds MIRRORS_TOKEN (and the model keys, to review each
  # patch again) and runs no repository code: the publisher fetches the mirror fresh, applies each patch with Git
  # hooks disabled, refuses anything outside dependency files (never .github/ or CI configuration) and the caps
  # the flow enforces, reviews it again, then pushes and opens it. Every request is untrusted: it was written by
  # a job whose repository code ran as root.
  publish:
    needs: [plan, prepare-product, run, second-chance-scan]
    if: always() && inputs.open_pr == 'true' && needs.plan.result == 'success' && needs.prepare-product.result == 'success'
    name: publish ${{ matrix.index }} ${{ matrix.source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - id: handoff
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: publication-${{ matrix.index }}
          path: ${{ runner.temp }}/publication
      # The claims the second-chance token job made: from its own artifact, never from `run`'s.
      # Only when the token job itself finished: otherwise an artifact of that name could be another job's.
      - uses: actions/download-artifact@v4
        if: inputs.second_chance == 'true' && needs.second-chance-scan.result == 'success'
        continue-on-error: true
        with:
          name: second-chance-${{ matrix.index }}
          path: ${{ runner.temp }}/second-chance
      - id: requests
        run: |
          slug=$(printf '%02d' "${{ matrix.index }}")-$(echo "${{ matrix.source }}" | tr '/' '-')
          echo "SLUG=$slug" >> "$GITHUB_ENV"
          # A second-chance outcome (requests/second-chance/*.json) counts too, and so does a claim alone: a claim the
          # run never answered (it died, wrote nothing) is still concluded by the publisher.
          if [ -d "$RUNNER_TEMP/publication/$slug/requests" ] && find "$RUNNER_TEMP/publication/$slug/requests" -maxdepth 2 -name '*.json' | grep -q .; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          elif [ -s "$RUNNER_TEMP/second-chance/claims.txt" ]; then
            mkdir -p "$RUNNER_TEMP/publication/$slug/requests"
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "No publication requests from this leg."
          fi
      - uses: actions/download-artifact@v4
        if: steps.requests.outputs.any == 'true'
        with:
          name: product
          path: ${{ runner.temp }}/handoff
      - name: Unpack the product
        if: steps.requests.outputs.any == 'true'
        env:
          PRODUCT_SHA256: ${{ needs.prepare-product.outputs.sha256 }}
          HANDOFF_KEY: ${{ secrets.HANDOFF_KEY }}
        run: |
          set -euo pipefail
          # The product this job runs with the token is the one prepare-product packed, not a replacement.
          echo "$PRODUCT_SHA256  $RUNNER_TEMP/handoff/product.tar.gz.enc" | sha256sum -c --quiet
          trap 'rm -f "$RUNNER_TEMP/handoff.key"' EXIT
          ( umask 077; printf '%s' "$HANDOFF_KEY" > "$RUNNER_TEMP/handoff.key" )
          unset HANDOFF_KEY
          mkdir -p "$RUNNER_TEMP/product"
          { openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass "file:$RUNNER_TEMP/handoff.key" -in "$RUNNER_TEMP/handoff/product.tar.gz.enc" | tar -xz -C "$RUNNER_TEMP/product"; }
          rm -f "$RUNNER_TEMP/handoff.key"
      - uses: actions/setup-node@v4
        if: steps.requests.outputs.any == 'true'
        with:
          node-version: 24
      - name: Install the product
        if: steps.requests.outputs.any == 'true'
        working-directory: ${{ runner.temp }}/product
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do corepack pnpm install --frozen-lockfile && break; [ "$attempt" -lt 3 ] || exit 1; sleep $((attempt * 15)); done
          corepack pnpm build
      - name: Import the hand-off as untrusted data
        if: steps.requests.outputs.any == 'true'
        working-directory: ${{ runner.temp }}/product
        env:
          MIRROR: ${{ matrix.mirror }}
          CI_GATE: ${{ inputs.ci_gate }}
          SECOND_CHANCE: ${{ inputs.second_chance }}
        run: |
          set -euo pipefail
          # As dovel.yml's publish job: only checked requests reach the publisher.
          mkdir -p "$RUNNER_TEMP/imported"
          node --import ./packages/part-a/node_modules/tsx/dist/loader.mjs scripts/import-publication-handoff.mjs \
            "$RUNNER_TEMP/publication/$SLUG" "$RUNNER_TEMP/imported/$SLUG" --owner "${MIRROR%%/*}" --name "${MIRROR#*/}" \
            --ci-gate "$CI_GATE" --ci-repair "$SECOND_CHANCE" --second-chance "$SECOND_CHANCE" --report "$RUNNER_TEMP/imported-report.json"
      - name: Publish the proposals
        if: steps.requests.outputs.any == 'true'
        env:
          DOVEL_INPUT_GITHUB: ${{ secrets.MIRRORS_TOKEN }}
          DOVEL_INPUT_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY }}
          DOVEL_INPUT_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          MIRROR: ${{ matrix.mirror }}
          CI_GATE: ${{ inputs.ci_gate }}
          MAX_CANDIDATES: ${{ inputs.max_candidates }}
          CATCH_UP: ${{ inputs.catch_up }}
          SECOND_CHANCE: ${{ inputs.second_chance }}
        run: |
          # Not -e: what the publisher recorded is kept even when it fails.
          set +e -uo pipefail
          handoff="$RUNNER_TEMP/imported/$SLUG"
          secrets="$(node -e '
            const pairs = [["OPENROUTER_API_KEY", "DOVEL_INPUT_OPENROUTER"], ["ANTHROPIC_API_KEY", "DOVEL_INPUT_ANTHROPIC"], ["GH_TOKEN", "DOVEL_INPUT_GITHUB"]];
            process.stdout.write(JSON.stringify(Object.fromEntries(pairs.filter(([, from]) => process.env[from]).map(([to, from]) => [to, process.env[from]]))));
          ')"
          unset DOVEL_INPUT_OPENROUTER DOVEL_INPUT_ANTHROPIC DOVEL_INPUT_GITHUB
          progress=()
          if [ -f "$handoff/repository-progress.json" ]; then progress=(--progress "$handoff/repository-progress.json"); fi
          # The second-chance outcomes and the token job's claims (sc:<number>:<attempt> words only).
          second_chance=()
          if [ "$SECOND_CHANCE" = true ]; then
            second_chance=(--ci-repair true --second-chance true)
            claims="$(head -n 1 "$RUNNER_TEMP/second-chance/claims.txt" 2>/dev/null || true)"
            if [[ "$claims" =~ ^sc:[0-9]+:[A-Za-z0-9-]+(\ sc:[0-9]+:[A-Za-z0-9-]+)*$ ]]; then second_chance+=(--ci-repair-claims "$claims"); fi
          fi
          cd "$RUNNER_TEMP/product"
          node --import ./packages/part-a/node_modules/tsx/dist/loader.mjs scripts/publish-dovel-proposals.mjs "$handoff/requests" \
            --owner "${MIRROR%%/*}" --name "${MIRROR#*/}" --ci-gate "$CI_GATE" --max-proposals "$( [ "${CATCH_UP:-auto}" = true ] && echo 5 || echo "${MAX_CANDIDATES:-3}" )" "${progress[@]}" "${second_chance[@]+"${second_chance[@]}"}" \
            --results-out "$handoff/publication-results.json" --secrets-stdin <<<"$secrets" 2>&1 | tee "$handoff/publish.log"
          code=${PIPESTATUS[0]}
          mkdir -p "$RUNNER_TEMP/published/$SLUG"
          for file in repository-progress.json PROGRESS.md publication-results.json publish.log; do
            if [ -f "$handoff/$file" ]; then cp "$handoff/$file" "$RUNNER_TEMP/published/$SLUG/"; fi
          done
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always() && steps.requests.outputs.any == 'true'
        with:
          name: published-${{ matrix.index }}
          path: ${{ runner.temp }}/published
          if-no-files-found: ignore
          retention-days: 30

  score:
    needs: [prepare-product, run, publish]
    if: always() && needs.prepare-product.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: product
          path: ${{ runner.temp }}/handoff
      - name: Unpack the product
        env:
          PRODUCT_SHA256: ${{ needs.prepare-product.outputs.sha256 }}
          HANDOFF_KEY: ${{ secrets.HANDOFF_KEY }}
        run: |
          set -euo pipefail
          echo "$PRODUCT_SHA256  $RUNNER_TEMP/handoff/product.tar.gz.enc" | sha256sum -c --quiet
          trap 'rm -f "$RUNNER_TEMP/handoff.key"' EXIT
          ( umask 077; printf '%s' "$HANDOFF_KEY" > "$RUNNER_TEMP/handoff.key" )
          unset HANDOFF_KEY
          mkdir -p "$RUNNER_TEMP/product"
          { openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass "file:$RUNNER_TEMP/handoff.key" -in "$RUNNER_TEMP/handoff/product.tar.gz.enc" | tar -xz -C "$RUNNER_TEMP/product"; }
          rm -f "$RUNNER_TEMP/handoff.key"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the product
        working-directory: ${{ runner.temp }}/product
        run: corepack pnpm install --frozen-lockfile && corepack pnpm build
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: ${{ runner.temp }}/results
          merge-multiple: true
      # What the publisher did: each leg's progress doc with its pull requests (or why each was withheld).
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: published-*
          path: ${{ runner.temp }}/published
          merge-multiple: true
      - name: Overlay the publications
        run: |
          [ -d "$RUNNER_TEMP/published" ] || exit 0
          for leg in "$RUNNER_TEMP/published"/*/; do
            slug=$(basename "$leg"); [ -d "$RUNNER_TEMP/results/$slug" ] && cp -r "$leg." "$RUNNER_TEMP/results/$slug/"
          done
      - name: Score
        working-directory: ${{ runner.temp }}/product
        run: |
          node --import ./packages/part-a/node_modules/tsx/dist/loader.mjs scripts/evaluate-acceptance.mjs "$RUNNER_TEMP/results" | tee "$RUNNER_TEMP/EVALUATION.txt"
          node --import ./packages/part-a/node_modules/tsx/dist/loader.mjs scripts/evaluate-acceptance.mjs "$RUNNER_TEMP/results" --json > "$RUNNER_TEMP/evaluation.json"
          { echo '```'; cat "$RUNNER_TEMP/EVALUATION.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: |
            ${{ runner.temp }}/EVALUATION.txt
            ${{ runner.temp }}/evaluation.json
